# 提交前本地门禁：与 CI 同源，避免"推上去才发现格式不对"。
# 安装：pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 与 dev 依赖里的 ruff 同一大版本，避免本地与 CI 结论不一致
    rev: v0.17.3
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy（类型检查）
        entry: mypy src
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: pytest（只跑未标记 slow 的用例）
        entry: pytest -q -m "not slow"
        language: system
        types: [python]
        pass_filenames: false
