name: 功能建议
description: 提出新能力或改进（尤其是"接入一种新的评测报告格式"）
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景，而不是直接给方案。例如"我的项目报告只有聚合指标，想接入但被拒收"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一块
      options:
        - 数据中台（登记 / 版本 / 导出门禁 / 血缘）
        - 评测中台（入库 / 指标 / 配对检验 / 门禁）
        - 看板与报告
        - 审计与合规
        - 工程与发布
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: 考虑过的替代方案
      description: 说明为什么现有能力不够用
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该改动不需要引入第三方运行时依赖
        - label: 该改动不会降低指标口径的可复现性
