name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交作废旧的排队任务，避免矩阵 × N 浪费 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 静态门禁：跑一个平台就够，快反馈
  quality:
    name: 静态检查（ruff + mypy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff（E/F/W/I/N/UP/B/C4/SIM/RUF，0 告警）
        run: ruff check src tests
      - name: ruff format（不允许有差异）
        run: ruff format --check src tests
      - name: mypy（warn_return_any / strict_equality / check_untyped_defs）
        run: mypy src

  # 矩阵测试：3.10 是声明的最低版本，必须真跑
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 单元与端到端测试（含分支覆盖率门槛 85%）
        run: pytest -q --cov=maldi_platform --cov-report=term --cov-report=xml
      - name: 覆盖率报告
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # 命令行契约：从使用者视角把关键断言跑一遍
  smoke:
    name: 端到端冒烟（18 条契约）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: 冒烟
        run: python scripts/smoke.py

  # 打包：每次 PR 都验一遍，避免"代码好好的，发不出去"
  build:
    name: 构建与安装校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: 构建 sdist + wheel
        run: python -m build
      - name: 元数据校验
        run: twine check dist/*
      - name: 装 wheel 后命令行可用、类型标记随包分发
        run: |
          pip install dist/*.whl
          maldi-platform --version
          maldi-platform init --db /tmp/pkg.db
          maldi-platform db check --db /tmp/pkg.db
          python - <<'PY'
          import pathlib
          import maldi_platform as m
          marker = pathlib.Path(m.__file__).parent / "py.typed"
          assert marker.exists(), "py.typed 未随包分发"
          print("py.typed OK:", marker)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
