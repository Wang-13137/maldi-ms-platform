name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 单元与端到端测试
        run: pytest -q

  smoke:
    name: CLI 冒烟 + 看板 + 门禁退出码
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装
        run: pip install -e .

      - name: 数据中台登记
        run: |
          maldi-platform init --db demo.db
          maldi-platform dataset add --db demo.db --name synth-uti --version v1 \
            --classification synthetic --policy open --modality maldi-spectrum \
            --n-samples 40 --batch B1 --source ./examples/data
          maldi-platform dataset list --db demo.db

      - name: 评测中台入库
        run: |
          maldi-platform suite add --db demo.db --name m9-agent --dataset-version 1
          maldi-platform run ingest --db demo.db --suite 1 \
            --file examples/demo_report.json --label-prefix m9
          maldi-platform run list --db demo.db

      - name: 配对比较应显著
        run: |
          OUT=$(maldi-platform compare --db demo.db --a 1 --b 3)
          echo "$OUT"
          echo "$OUT" | grep -q "差异显著"

      - name: 门禁通过分支返回 0
        run: maldi-platform gate --db demo.db --run 1 --min-pass 0.6 --require-tool perm_called_rate

      - name: 回归门禁必须拦住并返回 1
        run: |
          set +e
          maldi-platform gate --db demo.db --run 3 --baseline 1
          CODE=$?
          set -e
          echo "exit=$CODE"
          test "$CODE" = "1"

      - name: 真实数据 payload 必须导不出
        run: |
          maldi-platform dataset add --db demo.db --name real-demo --version v1 \
            --classification real --policy restricted --source ./examples/data
          set +e
          maldi-platform dataset export-check --db demo.db --version-id 2 --target payload
          CODE=$?
          set -e
          test "$CODE" = "1"

      - name: 第二个算法项目同构接入（检索基准）
        run: |
          maldi-platform suite add --db demo.db --name rag-retrieval --dataset-version 1
          maldi-platform run ingest --db demo.db --suite 2 --file examples/rag_vector.json
          maldi-platform run ingest --db demo.db --suite 2 --file examples/rag_rerank.json
          A=$(maldi-platform run list --db demo.db --suite 2 --json | python -c "import json,sys;print(json.load(sys.stdin)[0]['id'])")
          B=$(maldi-platform run list --db demo.db --suite 2 --json | python -c "import json,sys;print(json.load(sys.stdin)[1]['id'])")
          OUT=$(maldi-platform compare --db demo.db --a "$A" --b "$B")
          echo "$OUT"
          echo "$OUT" | grep -q "差异显著"

      - name: 只有聚合结论的报告必须拒收
        run: |
          echo '{"left":"a","right":"b","n_pairs":10,"scopes":{}}' > /tmp/agg.json
          set +e
          maldi-platform run ingest --db demo.db --suite 2 --file /tmp/agg.json 2>&1 | tee /tmp/agg.log
          grep -q "逐题明细" /tmp/agg.log
          set -e

      - name: 生成看板
        run: |
          maldi-platform report --db demo.db --out reports/dashboard.html
          test -s reports/dashboard.html
          grep -q "评测中台" reports/dashboard.html
