version: 2
updates:
  # 开发依赖（pytest / ruff / mypy / build）——每周一次，合并前必须 CI 全绿
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "build"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
